[[folders]]
id = "new"
name = "NEW"
new_song = true
items = [
  { id = "this-week", name = "THIS WEEK", query = "added_at in local_days(7)" },
]
[folders.generate]
values = "0..=6"
id = "day-{value}"
name = "{days_ago}"
query = "added_at in local_day({value})"
insert_at = 0
