name: Optional Linux tar.gz

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build and verify extracted archive
        run: scripts/package-linux-tar.sh
      - uses: actions/upload-artifact@v7
        with:
          name: optional-linux-x86_64-tar
          path: |
            dist/linux-tar/*.tar.gz
            dist/linux-tar/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
