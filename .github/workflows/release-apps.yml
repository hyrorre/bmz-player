name: Release Apps

'on':
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string
      upload_to_release:
        description: Upload artifacts to the GitHub Release
        required: true
        default: false
        type: boolean
      clobber_assets:
        description: Replace existing release assets with the same names
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-apps-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BMZ_UPDATE_PUBLIC_KEY: ${{ vars.BMZ_UPDATE_PUBLIC_KEY }}
  BMZ_WINDOWS_UPDATER_LAYOUT: ${{ vars.BMZ_WINDOWS_UPDATER_LAYOUT || 'grouped' }}
  BMZ_UPDATE_BRIDGE_TAG: ${{ vars.BMZ_UPDATE_BRIDGE_TAG }}

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      should_upload: ${{ steps.meta.outputs.should_upload }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_UPLOAD: ${{ inputs.upload_to_release }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [[ -z "${tag}" ]]; then
            echo "release tag is required" >&2
            exit 1
          fi

          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${cargo_version}" ]]; then
            echo "failed to read workspace version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "${version}" != "${cargo_version}" ]]; then
            echo "tag ${tag} does not match workspace version ${cargo_version}" >&2
            exit 1
          fi

          should_upload=false
          if [[ "${EVENT_NAME}" == "release" || "${INPUT_UPLOAD}" == "true" ]]; then
            should_upload=true
          fi

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=$(git rev-parse HEAD)"
            echo "should_upload=${should_upload}"
          } >> "${GITHUB_OUTPUT}"

      - name: Test update metadata generators
        run: |
          node --test scripts/generate-update-metadata.test.mjs
          node --test scripts/verify-sparkle-signature.test.mjs
          python3 scripts/test_sparkle_appcast.py
          node --test scripts/combine-client-hash-manifests.test.mjs

  build-windows:
    name: Build Windows x64
    runs-on: windows-2025
    needs: metadata
    env:
      BMZ_VERSION: ${{ needs.metadata.outputs.version }}
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKGRS_TRIPLET: x64-windows-release
      VCPKG_ROOT: C:\vcpkg
      VCPKGRS_DYNAMIC: 1
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          submodules: recursive

      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustup show
          rustc -Vv
          cargo -V

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-x64-${{ hashFiles('Cargo.lock', 'triplets/x64-windows-release.cmake') }}
          restore-keys: |
            release-windows-x64-

      - name: Install cargo-about
        shell: pwsh
        run: cargo install --locked --features cli cargo-about

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

          if (-not (Test-Path -LiteralPath (Join-Path $env:VCPKG_ROOT "vcpkg.exe"))) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            & (Join-Path $env:VCPKG_ROOT "bootstrap-vcpkg.bat") -disableMetrics
          }

          $overlayTriplets = Join-Path $env:GITHUB_WORKSPACE "triplets"
          & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") install `
            "--overlay-triplets=$overlayTriplets" `
            "ffmpeg:$env:VCPKG_DEFAULT_TRIPLET"

      - name: Record Windows dependency provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null

          $provenance = "dist\release\bmz-player-v$env:BMZ_VERSION-windows-x64-provenance.txt"
          "BMZ Player $env:BMZ_VERSION Windows x64 dependency provenance" | Out-File -LiteralPath $provenance -Encoding utf8
          "" | Out-File -LiteralPath $provenance -Encoding utf8 -Append
          "vcpkg packages:" | Out-File -LiteralPath $provenance -Encoding utf8 -Append
          & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") list ffmpeg | Out-File -LiteralPath $provenance -Encoding utf8 -Append

          $ffmpegBin = Join-Path $env:VCPKG_ROOT "installed\$env:VCPKG_DEFAULT_TRIPLET\bin"
          $ffmpegExe = Get-ChildItem -LiteralPath $ffmpegBin -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ffmpegExe) {
            "" | Out-File -LiteralPath $provenance -Encoding utf8 -Append
            "ffmpeg -version:" | Out-File -LiteralPath $provenance -Encoding utf8 -Append
            & $ffmpegExe.FullName -version | Out-File -LiteralPath $provenance -Encoding utf8 -Append
            if (Select-String -LiteralPath $provenance -Pattern "--enable-nonfree" -Quiet) {
              throw "FFmpeg was built with --enable-nonfree and must not be redistributed"
            }
          } else {
            "" | Out-File -LiteralPath $provenance -Encoding utf8 -Append
            "ffmpeg.exe was not present in vcpkg; package version was recorded from vcpkg list." | Out-File -LiteralPath $provenance -Encoding utf8 -Append
          }
      - name: Reject development client hash override
        shell: pwsh
        run: |
          if (Test-Path Env:BMZ_RIANIR_DEV_CLIENT_HASH) {
            throw "BMZ_RIANIR_DEV_CLIENT_HASH must not be set for official releases"
          }

      - name: Package Windows app
        shell: pwsh
        run: |
          if ("${{ needs.metadata.outputs.should_upload }}" -eq "true" -and -not $env:BMZ_UPDATE_PUBLIC_KEY) {
            throw "BMZ_UPDATE_PUBLIC_KEY must be configured before publishing automatic updates"
          }
          if ("${{ needs.metadata.outputs.should_upload }}" -eq "true" -and $env:BMZ_WINDOWS_UPDATER_LAYOUT -eq "grouped" -and -not $env:BMZ_UPDATE_BRIDGE_TAG) {
            throw "Publish a legacy-layout protocol-2 bridge first, then set BMZ_UPDATE_BRIDGE_TAG"
          }
          .\scripts\package-windows.ps1 `
            -Installer `
            -UpdaterLayout $env:BMZ_WINDOWS_UPDATER_LAYOUT `
            -DllDir (Join-Path $env:VCPKG_ROOT "installed\$env:VCPKG_DEFAULT_TRIPLET\bin")

      - name: Test portable update recovery
        shell: pwsh
        run: cargo test -p bmz-updater

      - name: Test installer file preservation
        shell: pwsh
        run: .\scripts\test-windows-installer.ps1

      - name: Test packaged data isolation
        shell: pwsh
        run: .\scripts\test-windows-package-paths.ps1 -BinaryDirectory "dist\windows\BMZ Player"

      - name: Verify packaged executable
        shell: pwsh
        run: |
          & "dist\windows\BMZ Player\bmz-player.exe" --help

      - name: Create Windows release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null

          node scripts/generate-client-hash-manifest.mjs `
            --executable "dist\windows\BMZ Player\bmz-player.exe" `
            --output "dist\release\bmz-player-v$env:BMZ_VERSION-windows-x64-client-manifest.json" `
            --version $env:BMZ_VERSION `
            --target windows-x64 `
            --git-commit '${{ needs.metadata.outputs.commit }}'

          $portable = "dist\release\bmz-player-v$env:BMZ_VERSION-windows-x64-portable.zip"
          Compress-Archive -Path "dist\windows\BMZ Player" -DestinationPath $portable -Force

          $installer = "dist\windows\installer\bmz-player-$env:BMZ_VERSION-windows-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "missing installer: $installer"
          }
          Copy-Item -LiteralPath $installer -Destination "dist\release\bmz-player-v$env:BMZ_VERSION-windows-x64-setup.exe" -Force

          Get-ChildItem -LiteralPath dist\release

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            minimum_system_version: '11.0'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            minimum_system_version: '10.13'
    env:
      BMZ_VERSION: ${{ needs.metadata.outputs.version }}
      BMZ_MACOS_ARCH: ${{ matrix.arch }}
      BMZ_MACOS_DEPLOYMENT_TARGET: ${{ matrix.minimum_system_version }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum_system_version }}
      BMZ_MACOS_CODESIGN_IDENTITY: ${{ secrets.BMZ_MACOS_CODESIGN_IDENTITY }}
      BMZ_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.BMZ_MACOS_CERTIFICATE_P12_BASE64 }}
      BMZ_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.BMZ_MACOS_CERTIFICATE_PASSWORD }}
      BMZ_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.BMZ_MACOS_KEYCHAIN_PASSWORD }}
      BMZ_MACOS_NOTARY_APPLE_ID: ${{ secrets.BMZ_MACOS_NOTARY_APPLE_ID }}
      BMZ_MACOS_NOTARY_PASSWORD: ${{ secrets.BMZ_MACOS_NOTARY_PASSWORD }}
      BMZ_MACOS_NOTARY_TEAM_ID: ${{ secrets.BMZ_MACOS_NOTARY_TEAM_ID }}
      BMZ_SPARKLE_PUBLIC_KEY: ${{ vars.BMZ_SPARKLE_PUBLIC_KEY }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          submodules: recursive

      - name: Show Rust toolchain
        run: |
          rustup show
          rustc -Vv
          cargo -V

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-${{ matrix.minimum_system_version }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            release-macos-${{ matrix.minimum_system_version }}-${{ matrix.target }}-

      - name: Cache macOS FFmpeg
        id: cache-macos-ffmpeg
        uses: actions/cache@v5
        with:
          path: .cache/bmz-ffmpeg/${{ matrix.target }}
          key: release-macos-ffmpeg-${{ matrix.target }}-${{ matrix.minimum_system_version }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}

      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about

      - name: Install macOS build dependencies
        run: |
          brew install nasm pkg-config

      - name: Build macOS FFmpeg
        if: steps.cache-macos-ffmpeg.outputs.cache-hit != 'true'
        run: |
          scripts/build-ffmpeg-macos.sh \
            --target "${{ matrix.target }}" \
            --prefix "${GITHUB_WORKSPACE}/.cache/bmz-ffmpeg/${{ matrix.target }}"

      - name: Configure macOS build environment
        run: |
          FFMPEG_PREFIX="${GITHUB_WORKSPACE}/.cache/bmz-ffmpeg/${{ matrix.target }}"
          test -f "${FFMPEG_PREFIX}/lib/pkgconfig/libavcodec.pc"
          test -f "${FFMPEG_PREFIX}/share/bmz-player/ffmpeg-build.txt"
          {
            echo "FFMPEG_DIR=${FFMPEG_PREFIX}"
            echo "PKG_CONFIG_PATH=${FFMPEG_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "${GITHUB_ENV}"
          rustup target add "${{ matrix.target }}"
          cargo clean -p ffmpeg-sys-next --target "${{ matrix.target }}"

      - name: Import macOS signing certificate
        run: |
          {
            echo "BMZ_MACOS_SIGNING_READY=0"
            echo "BMZ_MACOS_NOTARIZATION_READY=0"
          } >> "${GITHUB_ENV}"

          if [[ -z "${BMZ_MACOS_CODESIGN_IDENTITY}" || -z "${BMZ_MACOS_CERTIFICATE_P12_BASE64}" || -z "${BMZ_MACOS_CERTIFICATE_PASSWORD}" || -z "${BMZ_MACOS_KEYCHAIN_PASSWORD}" ]]; then
            echo "Developer ID signing secrets are not configured; using ad-hoc signing."
            exit 0
          fi

          certificate_path="${RUNNER_TEMP}/bmz-macos-codesign.p12"
          keychain_path="${RUNNER_TEMP}/bmz-macos-codesign.keychain-db"
          printf '%s' "${BMZ_MACOS_CERTIFICATE_P12_BASE64}" | base64 -D > "${certificate_path}"

          security create-keychain -p "${BMZ_MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${BMZ_MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${BMZ_MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${BMZ_MACOS_KEYCHAIN_PASSWORD}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')

          {
            echo "BMZ_MACOS_SIGNING_READY=1"
            echo "BMZ_MACOS_KEYCHAIN_PATH=${keychain_path}"
          } >> "${GITHUB_ENV}"

          if [[ -n "${BMZ_MACOS_NOTARY_APPLE_ID}" && -n "${BMZ_MACOS_NOTARY_PASSWORD}" && -n "${BMZ_MACOS_NOTARY_TEAM_ID}" ]]; then
            echo "BMZ_MACOS_NOTARIZATION_READY=1" >> "${GITHUB_ENV}"
          else
            echo "Notarization secrets are not configured; the app will be signed but not notarized."
          fi

      - name: Record macOS dependency provenance
        run: |
          mkdir -p dist/release

          provenance="dist/release/bmz-player-v${BMZ_VERSION}-macos-${BMZ_MACOS_ARCH}-ffmpeg-build.txt"
          cp "${FFMPEG_DIR}/share/bmz-player/ffmpeg-build.txt" "${provenance}"
          if grep -q -- "--enable-nonfree" "${provenance}"; then
            echo "FFmpeg was built with --enable-nonfree and must not be redistributed" >&2
            exit 1
          fi

      - name: Reject development client hash override
        run: |
          if [[ "${BMZ_RIANIR_DEV_CLIENT_HASH+x}" == x ]]; then
            echo "BMZ_RIANIR_DEV_CLIENT_HASH must not be set for official releases" >&2
            exit 1
          fi

      - name: Package macOS app
        run: |
          if [[ "${{ needs.metadata.outputs.should_upload }}" == "true" ]]; then
            # Sparkle's EdDSA signing is independent of optional Developer ID signing/notarization.
            [[ -n "${BMZ_SPARKLE_PUBLIC_KEY}" ]] || {
              echo "BMZ_SPARKLE_PUBLIC_KEY must be configured before publishing automatic updates" >&2
              exit 1
            }
          fi
          if [[ -n "${BMZ_SPARKLE_PUBLIC_KEY}" ]]; then
            export BMZ_SPARKLE_DIR="${RUNNER_TEMP}/bmz-sparkle"
            bash scripts/prepare-sparkle.sh "${BMZ_SPARKLE_DIR}"
            clang -fobjc-arc -fblocks -F"${BMZ_SPARKLE_DIR}" -framework AppKit -framework Sparkle \
              -Wl,-rpath,"${BMZ_SPARKLE_DIR}" scripts/test-sparkle-bridge.m -o "${RUNNER_TEMP}/bmz-test-sparkle-bridge"
            "${RUNNER_TEMP}/bmz-test-sparkle-bridge"
            echo "BMZ_SPARKLE_DIR=${BMZ_SPARKLE_DIR}" >> "${GITHUB_ENV}"
          fi
          sign_args=(--ad-hoc-sign)
          if [[ "${BMZ_MACOS_SIGNING_READY}" == "1" ]]; then
            sign_args=(--sign "${BMZ_MACOS_CODESIGN_IDENTITY}")
          fi

          scripts/package-macos-app.sh \
            --target "${{ matrix.target }}" \
            --minimum-system-version "${BMZ_MACOS_DEPLOYMENT_TARGET}" \
            --bundle-dylibs \
            "${sign_args[@]}"

      - name: Verify packaged executable
        run: |
          "dist/macos/BMZ Player.app/Contents/MacOS/bmz-player" --help

      - name: Notarize macOS app
        run: |
          if [[ "${BMZ_MACOS_NOTARIZATION_READY}" != "1" ]]; then
            echo "Notarization secrets are not configured; skipping notarization."
            exit 0
          fi

          notary_zip="${RUNNER_TEMP}/bmz-player-${BMZ_VERSION}-macos-${BMZ_MACOS_ARCH}-notary.zip"
          ditto -c -k --keepParent "dist/macos/BMZ Player.app" "${notary_zip}"
          xcrun notarytool submit "${notary_zip}" \
            --apple-id "${BMZ_MACOS_NOTARY_APPLE_ID}" \
            --password "${BMZ_MACOS_NOTARY_PASSWORD}" \
            --team-id "${BMZ_MACOS_NOTARY_TEAM_ID}" \
            --wait
          xcrun stapler staple "dist/macos/BMZ Player.app"
          xcrun stapler validate "dist/macos/BMZ Player.app"
          spctl --assess --type execute --verbose=4 "dist/macos/BMZ Player.app"

      - name: Create macOS release files
        run: |
          mkdir -p dist/release
          node scripts/generate-client-hash-manifest.mjs \
            --executable "dist/macos/BMZ Player.app/Contents/MacOS/bmz-player" \
            --output "dist/release/bmz-player-v${BMZ_VERSION}-macos-${BMZ_MACOS_ARCH}-client-manifest.json" \
            --version "${BMZ_VERSION}" \
            --target "macos-${BMZ_MACOS_ARCH}" \
            --git-commit "${{ needs.metadata.outputs.commit }}"
          ditto -c -k --keepParent \
            "dist/macos/BMZ Player.app" \
            "dist/release/bmz-player-v${BMZ_VERSION}-macos-${BMZ_MACOS_ARCH}.app.zip"
          ls -la dist/release

      - name: Sign macOS update archive
        if: needs.metadata.outputs.should_upload == 'true'
        env:
          BMZ_SPARKLE_PRIVATE_KEY: ${{ secrets.BMZ_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${BMZ_SPARKLE_PRIVATE_KEY}"
          archive="dist/release/bmz-player-v${BMZ_VERSION}-macos-${BMZ_MACOS_ARCH}.app.zip"
          # Sparkle's tool reads its exported EdDSA private key from stdin.
          printf '%s' "${BMZ_SPARKLE_PRIVATE_KEY}" | "${BMZ_SPARKLE_DIR}/bin/sign_update" --ed-key-file - -p "${archive}" \
            > "dist/release/sparkle-${BMZ_MACOS_ARCH}.signature"
          # Verify the archive with the embedded public key, independent of private-key format.
          node scripts/verify-sparkle-signature.mjs "${archive}" "dist/release/sparkle-${BMZ_MACOS_ARCH}.signature"

      - name: Upload macOS release files
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Delete macOS signing keychain
        if: always()
        run: |
          if [[ -n "${BMZ_MACOS_KEYCHAIN_PATH:-}" && -f "${BMZ_MACOS_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${BMZ_MACOS_KEYCHAIN_PATH}"
          fi

  build-flatpak:
    name: Build Linux Flatpak x64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    needs: metadata
    env:
      BMZ_VERSION: ${{ needs.metadata.outputs.version }}
      BMZ_RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      FLATPAK_APP_ID: net.hyrorre.BMZPlayer
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          submodules: recursive

      - name: Prepare Flatpak container
        run: |
          if [ ! -s /etc/machine-id ]; then
            rm -f /etc/machine-id
            dbus-uuidgen --ensure=/etc/machine-id
          fi

          mkdir -p /var/lib/dbus

          if [ ! -s /var/lib/dbus/machine-id ]; then
            rm -f /var/lib/dbus/machine-id
            ln -s /etc/machine-id /var/lib/dbus/machine-id
          fi

          test -s /etc/machine-id
          test -s /var/lib/dbus/machine-id

      - name: Configure Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Show Flatpak toolchain
        run: |
          flatpak --version
          flatpak-builder --version
          appstreamcli --version
          command -v desktop-file-validate
          command -v dbus-run-session
          command -v node

      - name: Cache Flatpak builder state
        uses: actions/cache@v5
        with:
          path: .flatpak-builder
          key: release-flatpak-x64-${{ hashFiles('Cargo.lock', 'installer/flatpak/net.hyrorre.BMZPlayer.yml', 'installer/flatpak/net.hyrorre.BMZPlayer.metainfo.xml') }}
          restore-keys: |
            release-flatpak-x64-

      - name: Sync Flatpak package metadata version
        run: |
          scripts/package-flatpak.sh --sync-metadata-only

      - name: Validate Flatpak metadata
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${cargo_version}" != "${BMZ_VERSION}" ]]; then
            echo "Cargo.toml version ${cargo_version} does not match BMZ_VERSION ${BMZ_VERSION}" >&2
            exit 1
          fi
          if [[ "${BMZ_RELEASE_TAG}" != "v${BMZ_VERSION}" ]]; then
            echo "release tag ${BMZ_RELEASE_TAG} does not match BMZ_VERSION ${BMZ_VERSION}" >&2
            exit 1
          fi
          if ! grep -q "<release version=\"${BMZ_VERSION}\"" installer/flatpak/net.hyrorre.BMZPlayer.metainfo.xml; then
            echo "metainfo.xml does not contain release version ${BMZ_VERSION}" >&2
            exit 1
          fi
          first_release="$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' installer/flatpak/net.hyrorre.BMZPlayer.metainfo.xml | head -n 1)"
          if [[ "${first_release}" != "${BMZ_VERSION}" ]]; then
            echo "latest metainfo release ${first_release} does not match BMZ_VERSION ${BMZ_VERSION}" >&2
            exit 1
          fi
          desktop-file-validate installer/flatpak/net.hyrorre.BMZPlayer.desktop
          appstreamcli validate --no-net installer/flatpak/net.hyrorre.BMZPlayer.metainfo.xml
          flatpak-builder --show-deps installer/flatpak/net.hyrorre.BMZPlayer.yml

      - name: Record Flatpak dependency provenance
        run: |
          mkdir -p dist/release
          provenance="dist/release/bmz-player-v${BMZ_VERSION}-linux-x64-flatpak-provenance.txt"
          {
            echo "BMZ Player ${BMZ_VERSION} Linux x64 Flatpak dependency provenance"
            echo
            echo "Flatpak:"
            flatpak --version
            flatpak-builder --version
            echo
            echo "Manifest:"
            sed -n '1,220p' installer/flatpak/net.hyrorre.BMZPlayer.yml
          } > "${provenance}"

      - name: Reject development client hash override
        run: |
          if [[ "${BMZ_RIANIR_DEV_CLIENT_HASH+x}" == x ]]; then
            echo "BMZ_RIANIR_DEV_CLIENT_HASH must not be set for official releases" >&2
            exit 1
          fi

      - name: Package Flatpak app
        run: |
          dbus-run-session -- scripts/package-flatpak.sh

      - name: Verify Flatpak bundle
        run: |
          dbus-run-session -- bash -c '
            flatpak install --user -y "dist/flatpak/bmz-player-${BMZ_VERSION}-linux.flatpak"
            flatpak run "${FLATPAK_APP_ID}" --help
          '

      - name: Create Flatpak release files
        run: |
          mkdir -p dist/release
          src="dist/flatpak/bmz-player-${BMZ_VERSION}-linux.flatpak"
          dst="dist/release/bmz-player-v${BMZ_VERSION}-linux-x64.flatpak"
          executable="dist/flatpak/build/files/bin/bmz-player"
          if [[ ! -f "${src}" ]]; then
            echo "missing Flatpak bundle: ${src}" >&2
            exit 1
          fi
          if [[ ! -x "${executable}" ]]; then
            echo "missing Flatpak executable: ${executable}" >&2
            exit 1
          fi

          node scripts/generate-client-hash-manifest.mjs \
            --executable "${executable}" \
            --output "dist/release/bmz-player-v${BMZ_VERSION}-linux-x64-flatpak-client-manifest.json" \
            --version "${BMZ_VERSION}" \
            --target linux-x64-flatpak \
            --git-commit "${{ needs.metadata.outputs.commit }}"

          cp "${src}" "${dst}"

          {
            echo
            echo "Flatpak installed refs after build:"
            dbus-run-session -- flatpak list --user
            echo
            echo "Installed app info:"
            dbus-run-session -- flatpak info --user "${FLATPAK_APP_ID}"
          } >> "dist/release/bmz-player-v${BMZ_VERSION}-linux-x64-flatpak-provenance.txt"

          ls -la dist/release

      - name: Upload Flatpak release files
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-flatpak-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  build-linux-tar:
    name: Build Linux tar x64
    runs-on: ubuntu-22.04
    needs: metadata
    timeout-minutes: 120
    env:
      BMZ_VERSION: ${{ needs.metadata.outputs.version }}
      BMZ_RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - name: Packaging regression checks
        run: python3 -m unittest discover -s installer/linux-tar -p 'test_*.py' -v
      - name: Reject development client hash override
        run: |
          if [[ "${BMZ_RIANIR_DEV_CLIENT_HASH+x}" == x ]]; then
            echo "BMZ_RIANIR_DEV_CLIENT_HASH must not be set for official releases" >&2
            exit 1
          fi
      - name: Build and verify runtime and corresponding sources
        id: package
        run: scripts/package-linux-tar.sh
      - name: Upload Linux tar release files
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-tar-x64
          path: |
            ${{ steps.package.outputs.runtime }}
            ${{ steps.package.outputs.sources }}
            ${{ steps.package.outputs.client_manifest }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attach-release-assets:
    name: Attach release assets
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build-windows
      - build-macos
      - build-flatpak
      - build-linux-tar
    permissions:
      contents: write
    concurrency:
      group: bmz-update-feed-publish
      cancel-in-progress: false
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 1

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Remove private metadata sidecars from release upload
        run: |
          set -euo pipefail
          find dist/release -maxdepth 1 -type f \
            \( -name "*.txt" -o \( -name "*.json" ! -name "*-client-manifest.json" \) \) \
            -print -delete

      - name: Combine client hash manifests
        env:
          BMZ_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          output="dist/release/client-manifest-bmz-player-v${BMZ_VERSION}.json"
          node scripts/combine-client-hash-manifests.mjs \
            --input-dir dist/release \
            --output "${output}" \
            --expected-targets windows-x64,macos-arm64,macos-x64,linux-x64-flatpak,linux-x64-tar
          find dist/release -maxdepth 1 -type f \
            -name "*-client-manifest.json" ! -path "${output}" \
            -print -delete
          cat "${output}"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist/release
          find . -maxdepth 1 -type f ! -name '*.signature' ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified release files for dry run
        if: needs.metadata.outputs.should_upload != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-files
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Generate signed update metadata
        if: needs.metadata.outputs.should_upload == 'true'
        env:
          BMZ_UPDATE_PRIVATE_KEY: ${{ secrets.BMZ_UPDATE_PRIVATE_KEY }}
          BMZ_VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/generate-update-metadata.mjs release dist/release "${BMZ_VERSION}"

      - name: Upload files to GitHub Release
        if: needs.metadata.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          CLOBBER_ASSETS: ${{ inputs.clobber_assets }}
        run: |
          set -euo pipefail
          files=()
          for asset in dist/release/*; do
            case "${asset}" in */updates.json|*.signature) continue ;; esac
            files+=("${asset}")
          done
          args=(release upload "${RELEASE_TAG}" "${files[@]}")
          if [[ "${CLOBBER_ASSETS:-false}" == "true" ]]; then
            args+=(--clobber)
          fi
          gh "${args[@]}"

      - name: Publish completed update metadata and Sparkle feeds
        if: needs.metadata.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          BMZ_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # New release metadata is a final commit marker, after every archive is available.
          gh release upload "${RELEASE_TAG}" dist/release/updates.json --clobber
          if ! gh release view update-feed >/dev/null 2>&1; then
            gh release create update-feed --title "BMZ update feeds" --notes "Static appcast files used by BMZ Player." --prerelease --latest=false
          fi
          prerelease="$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)"
          mkdir -p dist/feeds
          for arch in x64 arm64; do
            signature="$(cat "dist/release/sparkle-${arch}.signature")"
            archive="dist/release/bmz-player-v${BMZ_VERSION}-macos-${arch}.app.zip"
            size="$(stat -c %s "${archive}")"
            for channel in stable prerelease; do
              if [[ "${channel}" == stable && "${prerelease}" == true ]]; then continue; fi
              feed="appcast-${channel}-${arch}.xml"
              existing="$(gh release view update-feed --json assets --jq '.assets[].name')"
              if printf '%s\n' "${existing}" | grep -Fxq "${feed}"; then
                gh release download update-feed --pattern "${feed}" --dir dist/feeds --clobber
              fi
              python3 scripts/generate-sparkle-appcast.py --version "${BMZ_VERSION}" --arch "${arch}" \
                --signature "${signature}" --size "${size}" --previous "dist/feeds/${feed}" --output "dist/feeds/${feed}"
              gh release upload update-feed "dist/feeds/${feed}" --clobber
            done
          done
