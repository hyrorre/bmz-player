[workspace]
members = [
    "crates/bmz-core",
    "crates/bmz-chart",
    "crates/bmz-audio",
    "crates/bmz-gameplay",
    "crates/bmz-render",
    "crates/bmz-skin",
    "crates/bmz-skin-document",
    "crates/bmz-player",
    "crates/bmz-skin-convert",
    "crates/bmz-video",
    "crates/bmz-ffmpeg",
    "crates/bmz-font",
    "crates/bmz-updater",
]
default-members = ["crates/bmz-player"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.4.1"
license = "GPL-3.0-only"
authors = ["hyrorre"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
ryu = "1.0"
toml = "0.8"
base64 = "0.22"
flate2 = "1"
tar = "0.4.46"
sevenz-rust2 = { version = "0.21.3", features = ["util"] }
webbrowser = "1.2"
bytemuck = "1"
futures-util = "0.3"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3.2"

rusqlite = { version = "0.31", features = ["bundled"] }

md5 = "0.7"
sha2 = "0.10"
ed25519-dalek = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
getrandom = "0.2"
uuid = "1"
encoding_rs = "0.8"

cpal = "0.18"
windows = "0.62"
ctrlc = "3"
ffmpeg-next = { version = "9", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
wgpu = "29"
winit = "0.30"
gilrs = "0.10"
egui = "0.34"
egui-winit = "0.34"
egui-wgpu = "0.34"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls-tls-webpki-roots",
    "system-proxy",
] }
rayon = "1"
font-kit = "0.14"
ab_glyph = "0.2.32"
arboard = "3"
clipboard-win = { version = "5.4.1", features = ["std"] }
rfd = "0.15"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tga"] }
gif = "0.14.2"
everything-ipc = "0.1.4"
